<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#111" />
  <title>立志</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #111; overflow: hidden; }
    .stage {
      height: 100vh;
      height: 100dvh;
      position: relative;
    }
    .slide {
      display: none;
      height: 100%;
      align-items: center;
      justify-content: center;
      padding: env(safe-area-inset-top) 8px env(safe-area-inset-bottom);
    }
    .slide.is-on { display: flex; }
    .slide img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
    }
    .dots {
      position: absolute;
      left: 0;
      right: 0;
      bottom: calc(12px + env(safe-area-inset-bottom));
      display: flex;
      justify-content: center;
      gap: 8px;
    }
    .dots button {
      width: 7px;
      height: 7px;
      border: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.35);
      cursor: pointer;
    }
    .dots button[aria-current="true"] { background: #fff; }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="slide is-on"><img src="images/01.jpg" alt="" /></div>
    <div class="slide"><img src="images/02.jpg" alt="" /></div>
    <div class="slide"><img src="images/03.jpg" alt="" /></div>
    <div class="dots" id="dots">
      <button type="button" aria-label="1" aria-current="true"></button>
      <button type="button" aria-label="2"></button>
      <button type="button" aria-label="3"></button>
    </div>
  </div>
  <script>
    const slides = [...document.querySelectorAll(".slide")];
    const dots = [...document.querySelectorAll("#dots button")];
    const stage = document.getElementById("stage");
    let index = 0;
    let startX = 0;

    const show = (n) => {
      index = (n + slides.length) % slides.length;
      slides.forEach((slide, i) => slide.classList.toggle("is-on", i === index));
      dots.forEach((dot, i) => {
        if (i === index) dot.setAttribute("aria-current", "true");
        else dot.removeAttribute("aria-current");
      });
    };

    dots.forEach((dot, i) => dot.addEventListener("click", () => show(i)));
    stage.addEventListener("touchstart", (e) => {
      startX = e.changedTouches[0].clientX;
    }, { passive: true });
    stage.addEventListener("touchend", (e) => {
      const dx = e.changedTouches[0].clientX - startX;
      if (dx > 40) show(index - 1);
      if (dx < -40) show(index + 1);
    }, { passive: true });
    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight") show(index + 1);
      if (e.key === "ArrowLeft") show(index - 1);
    });
  </script>
</body>
</html>
